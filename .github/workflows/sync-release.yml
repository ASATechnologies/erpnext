name: Sync Upstream Release Tags & Publish

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  check-rebase-and-release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        major_version: [15, 16]

    steps:
      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Checkout Custom Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for New Upstream Tag
        id: tag_check
        run: |
          MAJOR="${{ matrix.major_version }}"

          # Fetch the latest release tag strictly matching v${MAJOR}.*
          TAG=$(curl -s https://api.github.com/repos/frappe/erpnext/releases | \
            jq -r '.[].tag_name' | grep -E "^v${MAJOR}\." | head -n 1)

          echo "Target upstream tag for v$MAJOR: $TAG"

          if [ -z "$TAG" ]; then
            echo "No tag found for version v$MAJOR."
            echo "EXISTS=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if tag already exists in local/remote repository
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists locally. Skipping run."
            echo "EXISTS=true" >> $GITHUB_OUTPUT
          else
            echo "New upstream tag detected: $TAG"
            echo "EXISTS=false" >> $GITHUB_OUTPUT
            echo "TAG=$TAG" >> $GITHUB_OUTPUT
          fi

      - name: Rebase Branding Branch & Apply Tag
        if: steps.tag_check.outputs.EXISTS == 'false'
        run: |
          TARGET_TAG="${{ steps.tag_check.outputs.TAG }}"
          BRANDING_BRANCH="asaerp-${{ matrix.major_version }}"

          echo "Target Tag: ${TARGET_TAG}"
          echo "Branding Branch: ${BRANDING_BRANCH}"

          # Add upstream remote & fetch target release tag
          git remote add upstream https://github.com/frappe/erpnext.git
          git fetch upstream tag $TARGET_TAG --no-tags

          # Checkout your specific branding branch
          git checkout ${BRANDING_BRANCH}

          # Rebase your branding branch directly onto the fetched upstream tag
          git rebase $TARGET_TAG

          # Force push the rebased branding branch to your origin repository
          git push origin ${BRANDING_BRANCH} --force-with-lease

          # Delete the local temporary tag fetched from upstream
          git tag -d "$TARGET_TAG"

          # Tag the HEAD of your rebased branding branch with the exact upstream version name
          git tag -a "$TARGET_TAG" -m "Release $TARGET_TAG"
          git push origin "$TARGET_TAG"
